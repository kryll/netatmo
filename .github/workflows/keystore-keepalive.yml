name: Keep signing keystore cache alive

# GitHub evicts caches that were not accessed for 7 days; the debug keystore lives in one,
# and losing it changes the app signature (updates from the app then fail to install).
on:
  schedule:
    - cron: "17 4 * * 1,4"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the keystore cache
        uses: actions/cache/restore@v4
        with:
          path: debug.keystore
          key: netatmo-debug-keystore-v2
          fail-on-cache-miss: true
