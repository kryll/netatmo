name: Backup existing signing key once
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: signing-backup-once
    steps:
      - name: Restore existing signing cache only
        id: existing
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: debug.keystore
          key: netatmo-debug-keystore-v2
          fail-on-cache-miss: true
      - name: Verify signer, encrypt, and verify private storage
        env:
          CACHE_HIT: ${{ steps.existing.outputs.cache-hit }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DEST_TOKEN: ${{ secrets.BACKUP_DEST_TOKEN }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          export WORK_TEMP="$RUNNER_TEMP/netatmo-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 -- "$WORK_TEMP"
          trap 'rm -f -- debug.keystore; rm -rf -- "$WORK_TEMP"' EXIT
          python3 - <<'PY'
          import base64, datetime, hashlib, json, os, pathlib, subprocess, tempfile, urllib.request
          key = pathlib.Path('debug.keystore')
          if os.environ['CACHE_HIT'] != 'true' or key.is_symlink() or not key.is_file() or key.stat().st_size == 0:
              raise SystemExit('Exact existing signing cache required')
          key.chmod(0o600)
          expected = '58c109c9a76ca8897ec575490b420df20af5c878445ba4ecc3f392932f82961c'
          cert = subprocess.run(['keytool', '-exportcert', '-keystore', str(key), '-alias', 'androiddebugkey', '-storepass', 'android'], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
          if cert.returncode or hashlib.sha256(cert.stdout).hexdigest() != expected:
              raise SystemExit('Existing signing certificate does not match public v310 APK')
          with tempfile.TemporaryDirectory(prefix='signing-backup-', dir=os.environ['WORK_TEMP']) as d:
              p = pathlib.Path(d)
              os.environ['GNUPGHOME'] = str(p / 'gnupg')
              pathlib.Path(os.environ['GNUPGHOME']).mkdir(mode=0o700)
              phrase = p / 'phrase'
              phrase.write_text(os.environ.pop('BACKUP_PASSPHRASE'))
              phrase.chmod(0o600)
              token = os.environ.pop('BACKUP_DEST_TOKEN')
              output = p / 'existing-key.asc'
              result = subprocess.run(['gpg', '--batch', '--yes', '--pinentry-mode', 'loopback', '--passphrase-file', str(phrase), '--armor', '--symmetric', '--cipher-algo', 'AES256', '--output', str(output), str(key)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              phrase.unlink()
              if result.returncode or not output.is_file() or not output.stat().st_size:
                  raise SystemExit('Signing encryption failed')
              encrypted = output.read_bytes()
              key.unlink()
              path = 'netatmo/existing-key-' + os.environ['GITHUB_RUN_ID']
              metadata = json.dumps({'schema': 1, 'source': 'kryll/netatmo', 'cache_key': 'netatmo-debug-keystore-v2', 'source_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'created_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'certificate_sha256': expected, 'ciphertext_sha256': hashlib.sha256(encrypted).hexdigest(), 'encryption': 'OpenPGP symmetric AES256 ASCII armor', 'payload': 'existing Android debug.keystore'}, sort_keys=True, indent=2).encode() + b'\n'
              headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'netatmo-private-signing-backup'}
              def store_and_verify(suffix, content):
                  url = 'https://api.github.com/repos/kryll/signing-backups/contents/' + path + suffix
                  payload = json.dumps({'message': 'Preserve encrypted existing Netatmo signing key', 'content': base64.b64encode(content).decode()}).encode()
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, data=payload, headers=headers, method='PUT'), timeout=30) as response:
                          if response.status != 201:
                              raise SystemExit('Private backup upload failed')
                      with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                          remote = json.load(response)
                      if base64.b64decode(remote['content']) != content:
                          raise SystemExit('Private backup readback mismatch')
                  except Exception:
                      raise SystemExit('Private backup request failed') from None
              store_and_verify('.asc', encrypted)
              store_and_verify('.json', metadata)
              print('Encrypted existing key stored and read back privately')
              print('Certificate SHA256: ' + expected)
              print('Ciphertext SHA256: ' + hashlib.sha256(encrypted).hexdigest())
              print('Private repository path: ' + path + '.asc')
          PY
      - name: Remove signing material on success or failure
        if: always()
        shell: bash
        run: |
          set +x
          rm -f -- "$GITHUB_WORKSPACE/debug.keystore"
          rm -rf -- "$RUNNER_TEMP/netatmo-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$GITHUB_WORKSPACE/debug.keystore"
          test ! -e "$RUNNER_TEMP/netatmo-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
