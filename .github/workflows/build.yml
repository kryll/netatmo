name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      new_signing_key:
        description: "Create a NEW signing key (installed apps will have to be uninstalled once)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "netatmo.clientId=${{ secrets.NETATMO_CLIENT_ID }}" >> local.properties
          echo "netatmo.clientSecret=${{ secrets.NETATMO_CLIENT_SECRET }}" >> local.properties
          echo "meteosource.apiKey=${{ secrets.METEOSOURCE_API_KEY }}" >> local.properties
          echo "meteosource.placeId=logrono" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore persistent debug keystore
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: debug.keystore
          key: netatmo-debug-keystore-v2

      - name: Create debug keystore (only when explicitly requested)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          # GitHub deletes caches unused for 7 days. Silently generating a new key here would
          # publish an APK that Android refuses to install over the current app.
          if [ "${{ github.event.inputs.new_signing_key }}" != "true" ]; then
            echo "::error::Signing keystore cache not found. Refusing to build with a different key. Run this workflow manually with new_signing_key=true to create a new one on purpose."
            exit 1
          fi
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 36500 -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android -noprompt

      - name: Install debug keystore for Gradle
        run: |
          mkdir -p "$HOME/.android"
          cp debug.keystore "$HOME/.android/debug.keystore"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon

      - name: Verify WorkManager init and Hilt worker codegen
        # Structural proof for the @HiltWorker fix, beyond compiling:
        # 1) the merged manifest must NOT register androidx.work.WorkManagerInitializer
        #    (otherwise WorkManager starts before Application.onCreate with the default
        #    reflective factory and every @HiltWorker fails ENQUEUED -> FAILED instantly);
        # 2) androidx.startup's InitializationProvider must stay for the other initializers;
        # 3) KSP must have generated the Hilt assisted-factory binding for the worker.
        run: |
          set -e
          MANIFEST=$(find app/build/intermediates -path '*merged_manifest*' -path '*debug*' -name AndroidManifest.xml | head -1)
          test -n "$MANIFEST" || { echo "::error::Merged manifest not found"; exit 1; }
          echo "Merged manifest: $MANIFEST"
          if grep -q 'androidx.work.WorkManagerInitializer' "$MANIFEST"; then
            echo "::error::Merged manifest still registers androidx.work.WorkManagerInitializer: WorkManager would use the default factory and @HiltWorker creation would fail again."
            exit 1
          fi
          grep -q 'androidx.startup.InitializationProvider' "$MANIFEST" || { echo "::error::androidx.startup InitializationProvider missing from merged manifest"; exit 1; }
          echo "OK: default WorkManager initializer removed; androidx.startup provider kept."
          BINDING=$(grep -rl 'AdvancedAutomationWorker_AssistedFactory' app/build/generated/ksp/debug/java | head -1 || true)
          if [ -z "$BINDING" ]; then
            echo "::error::Hilt codegen did not produce AdvancedAutomationWorker_AssistedFactory binding."
            exit 1
          fi
          echo "OK: Hilt worker factory binding present: $BINDING"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Versión ${{ github.run_number }}"
          body: "Build automático #${{ github.run_number }} · ${{ github.sha }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
