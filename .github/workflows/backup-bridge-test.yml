name: Signing backup bridge test (dummy only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dummy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: signing-backup-once
    steps:
      - name: Encrypt dummy bytes and verify private bridge
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DEST_TOKEN: ${{ secrets.BACKUP_DEST_TOKEN }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tempfile, urllib.request
          with tempfile.TemporaryDirectory(prefix='backup-dummy-') as d:
              p = pathlib.Path(d)
              os.environ['GNUPGHOME'] = str(p / 'gnupg')
              pathlib.Path(os.environ['GNUPGHOME']).mkdir(mode=0o700)
              phrase = p / 'phrase'
              phrase.write_text(os.environ.pop('BACKUP_PASSPHRASE'))
              phrase.chmod(0o600)
              token = os.environ.pop('BACKUP_DEST_TOKEN')
              dummy = b'PUBLIC DUMMY DATA ONLY - Netatmo backup bridge test v1\n'
              (p / 'dummy').write_bytes(dummy)
              def gpg(args):
                  r = subprocess.run(['gpg', '--batch', '--yes', '--pinentry-mode', 'loopback', '--passphrase-file', str(phrase)] + args, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  if r.returncode:
                      raise SystemExit('Dummy encryption/decryption failed')
              gpg(['--symmetric', '--cipher-algo', 'AES256', '--output', str(p / 'dummy.gpg'), str(p / 'dummy')])
              encrypted = (p / 'dummy.gpg').read_bytes()
              url = 'https://api.github.com/repos/kryll/signing-backups/contents/tests/bridge-dummy-' + os.environ['GITHUB_RUN_ID'] + '.gpg'
              headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'netatmo-private-backup-dummy'}
              payload = json.dumps({'message': 'Test encrypted dummy backup bridge', 'content': base64.b64encode(encrypted).decode()}).encode()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, data=payload, headers=headers, method='PUT'), timeout=30) as response:
                      if response.status != 201:
                          raise SystemExit('Dummy upload failed')
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                      remote = json.load(response)
                  recovered = base64.b64decode(remote['content'])
              except Exception:
                  raise SystemExit('Private dummy bridge request failed') from None
              if recovered != encrypted:
                  raise SystemExit('Dummy ciphertext comparison failed')
              (p / 'downloaded.gpg').write_bytes(recovered)
              gpg(['--decrypt', '--output', str(p / 'recovered'), str(p / 'downloaded.gpg')])
              phrase.unlink()
              if (p / 'recovered').read_bytes() != dummy:
                  raise SystemExit('Dummy plaintext comparison failed')
              print('Dummy-only private upload/download and decryption: PASS')
              print('Ciphertext SHA256: ' + hashlib.sha256(encrypted).hexdigest())
          PY
